
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC Build AI Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#0f0f0f;
            color:white;
        }

        .navbar{
            width:100%;
            background:#161616;
            padding:20px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
            position:sticky;
            top:0;
            z-index:100;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:limegreen;
        }

        .logout-btn{
            background:red;
            border:none;
            padding:10px 20px;
            color:white;
            border-radius:5px;
            cursor:pointer;
            transition:0.3s;
        }

        .logout-btn:hover{
            background:darkred;
        }

        .container{
            padding:40px;
        }

        .welcome-card{
            background:#1c1c1c;
            padding:30px;
            border-radius:15px;
            margin-bottom:40px;
            border:1px solid #333;
        }

        .welcome-card h1{
            margin-bottom:15px;
            color:limegreen;
        }

        .welcome-card p{
            margin-top:8px;
            color:#ccc;
        }

        .section-title{
            margin-bottom:20px;
            font-size:28px;
            color:white;
        }

        .components-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .component-card{
            background:#1b1b1b;
            border:1px solid #333;
            border-radius:12px;
            padding:20px;
            transition:0.3s;
        }

        .component-card:hover{
            transform:translateY(-5px);
            border:1px solid limegreen;
            box-shadow:0 0 15px rgba(50,205,50,0.3);
        }

        .component-name{
            font-size:22px;
            color:limegreen;
            margin-bottom:10px;
        }

        .component-type{
            color:#ccc;
            font-size:15px;
        }

        .footer{
            text-align:center;
            padding:30px;
            margin-top:50px;
            background:#161616;
            color:#777;
        }

    </style>

</head>
<body>

    <div class="navbar">

        <div class="logo">
            PC Build AI
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

    <div class="container">

        <div class="welcome-card">

            <h1 id="welcome"></h1>

            <p id="email"></p>

            <p id="preferences"></p>

        </div>

        <h2 class="section-title">
            Available PC Components
        </h2>

        <div class="components-grid" id="components">

        </div>

    </div>

    <div class="footer">

        PC Build AI © 2026 | Full Stack AI Powered PC Builder

    </div>

<script>

const API_BASE = 'http://localhost:5000'

const token = localStorage.getItem("token");

if(!token){

    window.location.href = "login.html";

}

const user = JSON.parse(localStorage.getItem("user"));

document.getElementById("welcome").innerHTML =
    "Welcome " + user.user_name;

document.getElementById("email").innerHTML =
    "Email: " + user.email;

document.getElementById("preferences").innerHTML =
    "Preferences: " + user.preferences;

function logout(){

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href = "login.html";

}

async function loadComponents(){

    try{

        const response = await fetch(`${API_BASE}/components`)

        const data = await response.json();

        console.log(data);

        const container = document.getElementById("components");

        container.innerHTML = "";

        data.forEach(component => {

            container.innerHTML += `

                <div class="component-card">

                    <div class="component-name">
                        ${component.component_name}
                    </div>

                    <div class="component-type">
                        ${component.type}
                    </div>

                </div>

            `;

        });

    }catch(error){

        console.log(error);

    }

}

loadComponents();

</script>

</body>
</html>
